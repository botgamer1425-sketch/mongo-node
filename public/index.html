<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NodeLab - Login & Signup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="header">
            <div class="logo">Node<span>Lab</span></div>
            <p>User Registration & Authentication</p>
        </header>


        <!-- Main Content -->
        <main class="auth-container">

            <!-- Sign Up Card -->
            <section class="auth-card">

                <div class="card-icon">
                    👤
                </div>

                <h2>Create Account</h2>

                <p class="card-description">
                    Sign up to create your NodeLab account.
                </p>

                <form id="signupForm">

                    <div class="form-group">
                        <label for="signupName">Full Name</label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="signupPassword">Password</label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >
                    </div>


                    <button type="submit" class="btn">
                        Create Account
                    </button>

                </form>

                <p id="signupMessage" class="message"></p>

            </section>


            <!-- Login Card -->
            <section class="auth-card">

                <div class="card-icon">
                    🔐
                </div>

                <h2>Welcome Back</h2>

                <p class="card-description">
                    Log in to access your dashboard.
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <button type="submit" class="btn login-btn">
                        Log In
                    </button>

                </form>

                <p id="loginMessage" class="message"></p>

            </section>

        </main>


        <!-- Footer -->
        <footer>
            <p>© 2026 NodeLab • Local Node.js Authentication System</p>
        </footer>

    </div>


    <script>

        // ==========================
        // Sign Up
        // ==========================

        document
            .getElementById("signupForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("signupName").value;

                const email =
                    document.getElementById("signupEmail").value;

                const password =
                    document.getElementById("signupPassword").value;

                const response = await fetch("/signup", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                });

                const data = await response.json();

                document.getElementById("signupMessage").textContent =
                    data.message;

                if (response.ok) {
                    document.getElementById("signupForm").reset();
                }

            });


        // ==========================
        // Login
        // ==========================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("loginEmail").value;

                const password =
                    document.getElementById("loginPassword").value;

                const response = await fetch("/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                document.getElementById("loginMessage").textContent =
                    data.message;

                if (response.ok) {

                    localStorage.setItem("userName", data.name);

                    window.location.href = "dashboard.html";
                }

            });

    </script>

</body>

</html>
